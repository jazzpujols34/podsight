name: Tests

on:
  push:
  pull_request:
  schedule:
    # Auto Pipeline commits with GITHUB_TOKEN, which never triggers a push run,
    # so new summaries are only checked here: ~2h after each pipeline cron.
    - cron: '0 4 * * *'
    - cron: '0 13 * * *'
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest

      - name: Run tests
        run: python -m pytest -q tests
